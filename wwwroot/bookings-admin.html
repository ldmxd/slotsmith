<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SlotSmith — Bookings</title>
<link rel="stylesheet" href="booking.css">
<style>
  body { padding-bottom: 40px; }
  .search-row { display: flex; gap: 10px; margin: 16px 20px 0; }
  .search-row input {
    flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
    font-size: 1rem; font-family: inherit;
  }
  table.bookings { width: calc(100% - 40px); margin: 16px 20px 30px; border-collapse: collapse; }
  table.bookings th {
    text-align: left; font-size: 0.8rem; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.02em; padding: 8px 10px; border-bottom: 1px solid var(--border);
  }
  table.bookings td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.bookings .customer-name { font-weight: 600; }
  table.bookings .customer-sub { color: var(--muted); font-size: 0.8rem; }
  .status-tag {
    font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    background: var(--panel); color: var(--muted); white-space: nowrap;
  }
  .status-tag.confirmed { background: var(--success-bg); color: var(--success); }
  .status-tag.cancelled { background: var(--danger-bg); color: var(--danger); }

  .tab-row { display: flex; gap: 8px; margin: 16px 20px 0; }

  /* ── Day-view calendar ─────────────────────────────────────────────── */
  .cal-controls { display: flex; align-items: center; gap: 10px; margin: 16px 20px; flex-wrap: wrap; }
  .cal-controls input[type=date], .cal-controls select {
    padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); font-family: inherit; font-size: 0.9rem;
  }
  .cal-nav-btn {
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border); background: #fff;
    cursor: pointer; font-size: 1.1rem; line-height: 1;
  }
  .cal-nav-btn:hover { background: var(--panel); }
  .cal-grid-wrap { margin: 8px 20px 30px; overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; }
  .cal-grid { display: flex; min-width: 600px; }
  .cal-time-col { flex: 0 0 56px; border-right: 1px solid var(--border); position: relative; }
  .cal-time-label { position: absolute; right: 8px; transform: translateY(-50%); font-size: 0.72rem; color: var(--muted); }
  .cal-staff-col { flex: 1; min-width: 170px; border-right: 1px solid var(--border); position: relative; }
  .cal-staff-col:last-child { border-right: none; }
  .cal-staff-header {
    padding: 10px; font-weight: 700; font-size: 0.9rem; text-align: center;
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  .cal-hour-line { position: absolute; left: 0; right: 0; border-top: 1px solid var(--border); }
  .cal-booking-block {
    position: absolute; left: 4px; right: 4px; border-radius: 8px; background: #f4f2fc;
    border: 1px solid var(--accent); padding: 4px 6px; font-size: 0.72rem; overflow: hidden;
    cursor: pointer; box-shadow: var(--shadow-sm); line-height: 1.3;
  }
  .cal-booking-block:hover { box-shadow: var(--shadow-md); }
  .cal-booking-block .cb-time { font-weight: 700; }
  .cal-booking-block .cb-name { font-weight: 600; }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/index.html"><span class="brand-mark"></span>SlotSmith</a>
  <div id="adminNav"></div>
</header>
<main>
  <p style="margin:16px 20px 0;color:var(--muted)">
    Search by client name, email, or phone to find a booking — handy when a customer calls in
    wanting to change or cancel one instead of using their own emailed link.
  </p>
  <div id="banner"></div>

  <div class="tab-row">
    <button class="pill-btn primary" id="tabListBtn">List</button>
    <button class="pill-btn" id="tabCalendarBtn">Calendar</button>
  </div>

  <div id="listView">
    <div class="search-row">
      <input id="searchInput" placeholder="Search by name, email, or phone…" autofocus>
      <button class="pill-btn primary" id="searchBtn">Search</button>
    </div>

    <div id="results"></div>
  </div>

  <div id="calendarView" style="display:none;">
    <div class="cal-controls">
      <button class="cal-nav-btn" id="calPrevBtn" aria-label="Previous day">&lsaquo;</button>
      <input type="date" id="calDateInput">
      <button class="cal-nav-btn" id="calNextBtn" aria-label="Next day">&rsaquo;</button>
      <button class="pill-btn" id="calTodayBtn">Today</button>
      <select id="calStaffFilter">
        <option value="all">All professionals</option>
      </select>
    </div>
    <div id="calStatus" style="margin:0 20px 8px;color:var(--muted);font-size:0.85rem;"></div>
    <div class="cal-grid-wrap"><div id="calGrid" class="cal-grid"></div></div>
  </div>
</main>
<script src="admin-nav.js"></script>
<script>
async function api(path, opts) {
  const r = await fetch(path, opts);
  if (r.status === 401) {
    location.href = '/admin-login.html?next=' + encodeURIComponent(location.pathname + location.search);
    return new Promise(() => {}); // page is navigating away — never resolve
  }
  const raw = await r.text();
  if (!r.ok) throw new Error(raw || r.statusText);
  return raw ? JSON.parse(raw) : null; // Results.Ok() with no body comes back as 200 + empty string, not 204
}

function fmtWhen(iso) {
  return new Date(iso).toLocaleString('en-AU', {
    weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit',
    timeZone: 'Australia/Sydney'
  });
}

function money(cents) {
  return (cents / 100).toLocaleString('en-AU', { style: 'currency', currency: 'AUD' });
}

let searching = false;

async function loadUpcoming() {
  if (searching) return;
  searching = true;
  const results = document.getElementById('results');
  results.innerHTML = '<p style="margin:16px 20px;color:var(--muted);">Loading…</p>';
  try {
    const rows = await api('/api/admin/bookings/upcoming');
    renderResults(rows, {
      heading: 'Upcoming bookings',
      empty: 'No upcoming bookings.'
    });
  } catch (err) {
    results.innerHTML = `<div class="banner error" style="margin:16px 20px;">Couldn't load upcoming bookings: ${err.message}</div>`;
  } finally {
    searching = false;
  }
}

async function runSearch() {
  const q = document.getElementById('searchInput').value.trim();

  // Nothing (or too little) typed — fall back to the default "what's coming up" view rather
  // than making the person search just to see anything at all.
  if (q.length < 2) {
    await loadUpcoming();
    return;
  }
  if (searching) return;
  searching = true;
  const results = document.getElementById('results');
  results.innerHTML = '<p style="margin:16px 20px;color:var(--muted);">Searching…</p>';

  try {
    const rows = await api(`/api/admin/bookings/search?q=${encodeURIComponent(q)}`);
    renderResults(rows, {
      heading: `Results for "${q}"`,
      empty: `No bookings found for "${q}".`
    });
  } catch (err) {
    results.innerHTML = `<div class="banner error" style="margin:16px 20px;">Search failed: ${err.message}</div>`;
  } finally {
    searching = false;
  }
}

function renderResults(rows, { heading, empty }) {
  const results = document.getElementById('results');

  if (!rows || rows.length === 0) {
    results.innerHTML = `
      <h2 class="section-title">${heading}</h2>
      <p style="margin:0 20px;color:var(--muted);">${empty}</p>
    `;
    return;
  }

  const table = document.createElement('table');
  table.className = 'bookings';
  table.innerHTML = `
    <thead>
      <tr><th>Client</th><th>Service</th><th>With</th><th>When</th><th>Status</th><th></th></tr>
    </thead>
    <tbody></tbody>
  `;
  const tbody = table.querySelector('tbody');

  for (const b of rows) {
    const status = (b.status ?? b.Status ?? '').toLowerCase();
    const isPast = new Date(b.startUtc ?? b.StartUtc).getTime() < Date.now();
    // Nothing sensible to do with a booking that's already cancelled, or already happened —
    // reschedule/cancel on the manage-booking.html end doesn't check for "this is in the past",
    // so cancelling an old appointment would fire the same "your booking has been cancelled"
    // email a live cancellation sends, which would be confusing for something that's already
    // over. Skip the button for both cases and say so directly instead.
    let actionHtml;
    if (status === 'cancelled') {
      actionHtml = '<span style="color:var(--muted);font-size:0.85rem;">Cancelled — no action</span>';
    } else if (isPast) {
      actionHtml = '<span style="color:var(--muted);font-size:0.85rem;">Already happened — no action</span>';
    } else {
      actionHtml = `<a class="pill-btn" style="padding:6px 14px;font-size:0.85rem;text-decoration:none;display:inline-block;"
             href="/manage-booking.html?token=${b.manageToken ?? b.ManageToken}" target="_blank" rel="noopener">
           Manage booking
         </a>`;
    }
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>
        <div class="customer-name">${b.customerName ?? b.CustomerName}</div>
        <div class="customer-sub">${b.customerEmail ?? b.CustomerEmail}${(b.customerPhone ?? b.CustomerPhone) ? ' · ' + (b.customerPhone ?? b.CustomerPhone) : ''}</div>
      </td>
      <td>
        ${b.serviceNames ?? b.ServiceNames}
        <div class="customer-sub">${money(b.totalPriceCents ?? b.TotalPriceCents)}</div>
      </td>
      <td>${b.staffName ?? b.StaffName}</td>
      <td>${fmtWhen(b.startUtc ?? b.StartUtc)}</td>
      <td><span class="status-tag ${status}">${b.status ?? b.Status}</span></td>
      <td>${actionHtml}</td>
    `;
    tbody.appendChild(tr);
  }

  const heading2 = document.createElement('h2');
  heading2.className = 'section-title';
  heading2.textContent = heading;

  results.innerHTML = '';
  results.appendChild(heading2);
  results.appendChild(table);
}

document.getElementById('searchBtn').onclick = runSearch;
document.getElementById('searchInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') runSearch();
});

// ── Tabs ─────────────────────────────────────────────────────────────────

const tabListBtn = document.getElementById('tabListBtn');
const tabCalendarBtn = document.getElementById('tabCalendarBtn');
const listView = document.getElementById('listView');
const calendarView = document.getElementById('calendarView');

function showTab(tab) {
  const isList = tab === 'list';
  listView.style.display = isList ? '' : 'none';
  calendarView.style.display = isList ? 'none' : '';
  tabListBtn.className = 'pill-btn' + (isList ? ' primary' : '');
  tabCalendarBtn.className = 'pill-btn' + (isList ? '' : ' primary');
  if (!isList) loadCalendarDay();
}
tabListBtn.onclick = () => showTab('list');
tabCalendarBtn.onclick = () => showTab('calendar');

// ── Calendar (day view): staff as columns, bookings positioned by time ────
// A day sheet rather than another list — lets front-desk staff see at a glance who's free when,
// across everyone or filtered to one professional.

let calStaff = [];
let calDate = new Date().toLocaleDateString('en-CA', { timeZone: 'Australia/Sydney' });

async function loadCalStaffOnce() {
  if (calStaff.length) return;
  calStaff = await api('/api/staff');
  const select = document.getElementById('calStaffFilter');
  for (const s of calStaff) {
    const opt = document.createElement('option');
    opt.value = s.staffId ?? s.StaffId;
    opt.textContent = s.displayName ?? s.DisplayName;
    select.appendChild(opt);
  }
}

function fmtHourLabel(minutesFromMidnight) {
  const h = Math.floor(minutesFromMidnight / 60);
  const ampm = h < 12 ? 'am' : 'pm';
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}${ampm}`;
}

const CAL_PX_PER_MIN = 1.2;
const CAL_HEADER_HEIGHT = 44;

async function loadCalendarDay() {
  await loadCalStaffOnce();
  document.getElementById('calDateInput').value = calDate;

  const grid = document.getElementById('calGrid');
  const status = document.getElementById('calStatus');
  grid.innerHTML = '';
  status.textContent = 'Loading…';

  let hours, bookings;
  try {
    [hours, bookings] = await Promise.all([
      api(`/api/admin/business-hours?date=${calDate}`),
      api(`/api/admin/bookings/day?date=${calDate}`),
    ]);
  } catch (err) {
    status.textContent = `Couldn't load: ${err.message}`;
    return;
  }

  const openStr = hours.open ?? hours.Open;
  const closeStr = hours.close ?? hours.Close;
  if (!openStr || !closeStr) {
    status.textContent = 'Closed this day.';
    return;
  }
  status.textContent = '';

  const [openH, openM] = openStr.split(':').map(Number);
  const [closeH, closeM] = closeStr.split(':').map(Number);
  const openMinutes = openH * 60 + openM;
  const closeMinutes = closeH * 60 + closeM;
  const gridHeight = (closeMinutes - openMinutes) * CAL_PX_PER_MIN;
  const colHeight = gridHeight + CAL_HEADER_HEIGHT;

  const staffFilterId = document.getElementById('calStaffFilter').value;
  const staffToShow = staffFilterId === 'all'
    ? calStaff
    : calStaff.filter(s => String(s.staffId ?? s.StaffId) === staffFilterId);

  if (staffToShow.length === 0) {
    status.textContent = 'No professionals to show.';
    return;
  }

  const timeCol = document.createElement('div');
  timeCol.className = 'cal-time-col';
  timeCol.style.height = `${colHeight}px`;
  timeCol.innerHTML = '<div class="cal-staff-header" style="visibility:hidden;">&nbsp;</div>';
  for (let m = openMinutes; m <= closeMinutes; m += 60) {
    const label = document.createElement('div');
    label.className = 'cal-time-label';
    label.style.top = `${CAL_HEADER_HEIGHT + (m - openMinutes) * CAL_PX_PER_MIN}px`;
    label.textContent = fmtHourLabel(m);
    timeCol.appendChild(label);
  }
  grid.appendChild(timeCol);

  for (const s of staffToShow) {
    const id = s.staffId ?? s.StaffId;
    const name = s.displayName ?? s.DisplayName;

    const col = document.createElement('div');
    col.className = 'cal-staff-col';
    col.style.height = `${colHeight}px`;

    const header = document.createElement('div');
    header.className = 'cal-staff-header';
    header.textContent = name;
    col.appendChild(header);

    for (let m = openMinutes; m <= closeMinutes; m += 60) {
      const line = document.createElement('div');
      line.className = 'cal-hour-line';
      line.style.top = `${CAL_HEADER_HEIGHT + (m - openMinutes) * CAL_PX_PER_MIN}px`;
      col.appendChild(line);
    }

    const staffBookings = bookings.filter(b => (b.staffId ?? b.StaffId) === id);
    for (const b of staffBookings) {
      // Relies on the browser's own clock being set to Sydney local time (true for staff actually
      // in the salon) — same assumption booking.js's slot buttons already make elsewhere.
      const start = new Date(b.startUtc ?? b.StartUtc);
      const end = new Date(b.endUtc ?? b.EndUtc);
      const startMin = start.getHours() * 60 + start.getMinutes();
      const endMin = end.getHours() * 60 + end.getMinutes();
      // Clamp to the visible business-hours window — a booking that somehow starts/ends outside
      // it (e.g. hours changed after the booking was made) just gets cut off at the edge rather
      // than pushing the grid layout around.
      const top = CAL_HEADER_HEIGHT + Math.max(0, startMin - openMinutes) * CAL_PX_PER_MIN;
      const height = Math.max(18, (Math.min(endMin, closeMinutes) - Math.max(startMin, openMinutes)) * CAL_PX_PER_MIN);

      const block = document.createElement('div');
      block.className = 'cal-booking-block';
      block.style.top = `${top}px`;
      block.style.height = `${height}px`;
      const timeLabel = start.toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' });
      block.innerHTML = `
        <div class="cb-time">${timeLabel}</div>
        <div class="cb-name">${b.customerName ?? b.CustomerName}</div>
        <div>${b.serviceNames ?? b.ServiceNames}</div>
      `;
      block.title = 'Open this booking';
      block.onclick = () => window.open(`/manage-booking.html?token=${b.manageToken ?? b.ManageToken}`, '_blank');
      col.appendChild(block);
    }

    grid.appendChild(col);
  }
}

function shiftCalDate(deltaDays) {
  const d = new Date(calDate + 'T00:00:00');
  d.setDate(d.getDate() + deltaDays);
  calDate = d.toLocaleDateString('en-CA');
  loadCalendarDay();
}

document.getElementById('calPrevBtn').onclick = () => shiftCalDate(-1);
document.getElementById('calNextBtn').onclick = () => shiftCalDate(1);
document.getElementById('calTodayBtn').onclick = () => {
  calDate = new Date().toLocaleDateString('en-CA', { timeZone: 'Australia/Sydney' });
  loadCalendarDay();
};
document.getElementById('calDateInput').onchange = (e) => { calDate = e.target.value; loadCalendarDay(); };
document.getElementById('calStaffFilter').onchange = () => loadCalendarDay();

loadUpcoming();
</script>
</body>
</html>
